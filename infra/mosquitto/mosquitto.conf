listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# NOTE (pilot -> production hardening, Phase 8):
# - disable allow_anonymous, add password_file or TLS client certs for gateways
# - enable listener-level TLS (port 8883) before any real deployment
