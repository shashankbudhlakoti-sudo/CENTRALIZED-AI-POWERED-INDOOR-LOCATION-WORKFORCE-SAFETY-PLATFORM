services:
  db:
    # Custom image combining PostGIS (for zones/GEOMETRY/ST_Contains) with
    # pgvector (for employees.face_embedding) - see postgres/Dockerfile.
    # ankane/pgvector alone does NOT include PostGIS despite its similar
    # naming to postgis/postgis - using it would break schema.sql's
    # `CREATE EXTENSION postgis` line entirely.
    build: ./postgres
    container_name: safety-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: safety
      POSTGRES_PASSWORD: safety_dev_pw
      POSTGRES_DB: safety_platform
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../contracts/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U safety -d safety_platform" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: safety-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: safety-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_pw
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  adminer:
    image: adminer:latest
    container_name: safety-adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:8080"

  backend:
    build: ../backend
    container_name: safety-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # psycopg3 driver explicit in the connection string - matches
      # requirements.txt's psycopg[binary]==3.1.19, not the psycopg2
      # SQLAlchemy defaults to otherwise.
      DATABASE_URL: postgresql+psycopg://safety:safety_dev_pw@db:5432/safety_platform
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: safety-platform
      PUBLIC_BASE_URL: http://host.docker.internal:8000
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
      - backend_uploads:/app/uploads

volumes:
  db_data:
  mosquitto_data:
  mosquitto_log:
  keycloak_data:
  backend_uploads:
