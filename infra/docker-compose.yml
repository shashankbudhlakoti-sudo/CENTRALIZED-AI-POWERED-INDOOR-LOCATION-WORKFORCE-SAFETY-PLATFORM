version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: safety-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: safety
      POSTGRES_PASSWORD: safety_dev_pw
      POSTGRES_DB: safety_platform
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../contracts/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safety -d safety_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: safety-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: safety-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_pw
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  backend:
    build: ../backend
    container_name: safety-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://safety:safety_dev_pw@db:5432/safety_platform
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: safety-platform
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app

volumes:
  db_data:
  mosquitto_data:
  mosquitto_log:
  keycloak_data:
